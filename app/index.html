<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="和暦変換">
  <title>和暦・西暦変換</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    h1 {
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 6px;
      margin-bottom: 48px;
      color: #8090b0;
    }

    .input-row {
      width: 100%;
      max-width: 600px;
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    #userInput {
      flex: 1;
      font-size: 32px;
      font-family: inherit;
      padding: 14px 18px;
      background: #16213e;
      border: 2px solid #2a3a5e;
      border-radius: 14px;
      color: #ffffff;
      outline: none;
      min-height: 72px;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }

    #userInput:focus {
      border-color: #4060c0;
    }

    #userInput::placeholder {
      color: #353c5a;
      font-size: 22px;
    }

    #micBtn {
      width: 72px;
      height: 72px;
      flex-shrink: 0;
      background: #16213e;
      border: 2px solid #2a3a5e;
      border-radius: 14px;
      color: #8090b0;
      font-size: 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    #micBtn:hover { border-color: #4060c0; color: #c0c8e0; }

    #micBtn.listening {
      border-color: #c03030;
      color: #e04040;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(192, 48, 48, 0.5); }
      50%       { box-shadow: 0 0 0 10px rgba(192, 48, 48, 0); }
    }

    #convertBtn {
      width: 100%;
      max-width: 600px;
      font-size: 22px;
      font-family: inherit;
      letter-spacing: 4px;
      padding: 16px;
      background: #1e3a8a;
      border: none;
      border-radius: 14px;
      color: #c0d0f0;
      cursor: pointer;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    #convertBtn:hover  { background: #2548a8; }
    #convertBtn:active { background: #152c6e; }

    .result-area {
      width: 100%;
      max-width: 600px;
      margin-top: 40px;
    }

    .result-card {
      font-size: 52px;
      font-weight: 300;
      letter-spacing: 2px;
      line-height: 1.3;
      color: #ffffff;
      text-align: center;
      padding: 28px 20px;
      background: #16213e;
      border-radius: 16px;
      margin-bottom: 12px;
    }

    .result-card.alt {
      font-size: 38px;
      color: #8090b0;
      background: #111827;
    }

    .result-card.err {
      font-size: 22px;
      color: #e05050;
      background: transparent;
    }

    .hint {
      width: 100%;
      max-width: 600px;
      font-size: 15px;
      color: #505870;
      text-align: center;
      margin-top: 44px;
      line-height: 2;
    }

    #installBtn {
      display: none;
      margin-top: 40px;
      font-size: 16px;
      padding: 10px 22px;
      background: transparent;
      border: 1px solid #303850;
      border-radius: 8px;
      color: #606880;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    #installBtn:hover { border-color: #4050a0; color: #9090c0; }
  </style>
</head>
<body>

<h1>和暦・西暦 変換</h1>

<div class="input-row">
  <input type="text" id="userInput" placeholder="令和6年　または　2024年"
         autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
  <button id="micBtn" title="音声入力" aria-label="音声入力">🎤</button>
</div>

<button id="convertBtn">変 換</button>

<div class="result-area" id="resultArea"></div>

<div class="hint" id="hint">
  例: 令和6年12月3日 → 2024年12月3日<br>
  例: 2024/12/3 → 令和6年12月3日<br>
  音声で「令和６年１２月３日は」と言うと自動変換
</div>

<button id="installBtn">ホーム画面に追加</button>

<script>
// ===== 元号データ =====
const ERAS = [
  { name: '令和', sy: 2019, sm:  5, sd:  1, offset: 2018 },
  { name: '平成', sy: 1989, sm:  1, sd:  8, offset: 1988 },
  { name: '昭和', sy: 1926, sm: 12, sd: 25, offset: 1925 },
  { name: '大正', sy: 1912, sm:  7, sd: 30, offset: 1911 },
  { name: '明治', sy: 1868, sm:  9, sd:  8, offset: 1867 },
];

function eraEndYear(i) {
  return i === 0 ? 2999 : ERAS[i - 1].sy;
}

// ===== 入力解析 =====
function parseInput(raw) {
  const s = raw.trim().replace(/　/g, '').replace(/\s+/g, '');
  if (!s) return null;

  // 和暦: (元号)(元|数字)(年)?(月)?(日)?
  let m = s.match(/^(令和|平成|昭和|大正|明治)(元|\d+)年?(?:(\d+)月(?:(\d+)日?)?)?/);
  if (m) {
    return {
      type: 'wareki',
      eraName: m[1],
      eraYear: m[2] === '元' ? 1 : parseInt(m[2]),
      month: m[3] ? parseInt(m[3]) : null,
      day:   m[4] ? parseInt(m[4]) : null,
    };
  }

  // 西暦: YYYY年[MM月[DD日]]
  m = s.match(/^(\d{4})年(?:(\d{1,2})月(?:(\d{1,2})日?)?)?/);
  if (m) return { type: 'seireki', year: +m[1], month: m[2] ? +m[2] : null, day: m[3] ? +m[3] : null };

  // 西暦: YYYY/MM[/DD]
  m = s.match(/^(\d{4})\/(\d{1,2})(?:\/(\d{1,2}))?/);
  if (m) return { type: 'seireki', year: +m[1], month: +m[2], day: m[3] ? +m[3] : null };

  // 西暦: YYYY-MM[-DD]
  m = s.match(/^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?/);
  if (m) return { type: 'seireki', year: +m[1], month: +m[2], day: m[3] ? +m[3] : null };

  // 西暦: YYYY のみ
  m = s.match(/^(\d{4})$/);
  if (m) return { type: 'seireki', year: +m[1], month: null, day: null };

  return null;
}

// ===== 変換ロジック =====
function warekiToSeireki(p) {
  const era = ERAS.find(e => e.name === p.eraName);
  if (!era) return [];
  const year = era.offset + p.eraYear;
  if (year < era.sy || year > eraEndYear(ERAS.indexOf(era))) return [];
  return [{ year, month: p.month, day: p.day }];
}

function seirekiToWareki(p) {
  const { year, month, day } = p;
  const out = [];

  for (let i = 0; i < ERAS.length; i++) {
    const era = ERAS[i];
    if (year < era.sy || year > eraEndYear(i)) continue;
    const eraYear = year - era.offset;
    if (eraYear < 1) continue;

    if (month !== null) {
      const cmpDay = day || 1;
      const target = new Date(year, month - 1, cmpDay).getTime();
      const start  = new Date(era.sy, era.sm - 1, era.sd).getTime();
      if (target < start) continue;

      if (i > 0) {
        const ne = ERAS[i - 1];
        const end = new Date(ne.sy, ne.sm - 1, ne.sd).getTime();
        if (target >= end) continue;
      }
    }

    out.push({
      era: era.name,
      year: eraYear,
      yearStr: eraYear === 1 ? '元' : String(eraYear),
      month,
      day,
    });
  }

  return out;
}

// ===== フォーマット =====
function fmtSeireki(r) {
  let s = `${r.year}年`;
  if (r.month !== null) s += `${r.month}月`;
  if (r.day   !== null) s += `${r.day}日`;
  return s;
}

function fmtWareki(r) {
  let s = `${r.era}${r.yearStr}年`;
  if (r.month !== null) s += `${r.month}月`;
  if (r.day   !== null) s += `${r.day}日`;
  return s;
}

// ===== UI =====
const inputEl    = document.getElementById('userInput');
const convertBtn = document.getElementById('convertBtn');
const resultArea = document.getElementById('resultArea');
const hintEl     = document.getElementById('hint');
const micBtn     = document.getElementById('micBtn');
const installBtn = document.getElementById('installBtn');

function showResult(lines, isError) {
  resultArea.innerHTML = '';
  hintEl.style.display = 'none';

  lines.forEach((text, i) => {
    const div = document.createElement('div');
    div.className = 'result-card' + (isError ? ' err' : (i > 0 ? ' alt' : ''));
    div.textContent = text;
    resultArea.appendChild(div);
  });
}

function convert() {
  const raw = inputEl.value;
  if (!raw.trim()) {
    resultArea.innerHTML = '';
    hintEl.style.display = '';
    return;
  }

  const parsed = parseInput(raw);
  if (!parsed) {
    resultArea.innerHTML = '';
    return;
  }

  let results, lines;

  if (parsed.type === 'wareki') {
    results = warekiToSeireki(parsed);
    if (!results.length) { showResult(['変換できません'], true); return; }
    lines = results.map(fmtSeireki);
  } else {
    results = seirekiToWareki(parsed);
    if (!results.length) { showResult(['対応する元号がありません'], true); return; }
    lines = results.map(fmtWareki);
  }

  showResult(lines, false);
}

convertBtn.addEventListener('click', convert);
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') convert(); });
inputEl.addEventListener('input', convert);

// ===== 音声入力 =====
(function initSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { micBtn.style.display = 'none'; return; }

  const rec = new SR();
  rec.lang = 'ja-JP';
  rec.continuous = false;
  rec.interimResults = true;
  let listening = false;

  rec.onresult = (event) => {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }

    if (event.results[event.results.length - 1].isFinal) {
      let text = transcript.trim();
      if (text.endsWith('は')) text = text.slice(0, -1).trim();
      inputEl.value = text;
      convert();
    } else {
      inputEl.value = transcript;
    }
  };

  rec.onend = () => { listening = false; micBtn.classList.remove('listening'); };
  rec.onerror = () => { listening = false; micBtn.classList.remove('listening'); };

  micBtn.addEventListener('click', () => {
    if (listening) {
      rec.stop();
    } else {
      inputEl.value = '';
      resultArea.innerHTML = '';
      hintEl.style.display = '';
      try {
        rec.start();
        listening = true;
        micBtn.classList.add('listening');
      } catch (e) { /* already started */ }
    }
  });
})();

// ===== PWA インストール =====
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'block';
});
installBtn.addEventListener('click', () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
  installBtn.style.display = 'none';
});

// ===== Service Worker =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
